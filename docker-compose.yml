services:
  postgres-test:
    image: postgres:18-alpine
    # pg_stat_statements for top_queries, the top-sql / sql-tuning skills and tests/skills.integration.test.js
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-testdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-testdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp-net

  # OIDC identity provider for the OAuth integration tests (docker compose --profile oidc up -d oidc-test).
  # Issues tokens without a login screen; users/groups are defined in tests/oidc/mock-oauth2-config.json.
  # Run: OIDC_TEST_ISSUER=http://localhost:8080/default npx vitest run tests/oidc.integration.test.js
  oidc-test:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles: ["oidc"]
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./tests/oidc/mock-oauth2-config.json:/config/config.json:ro
    networks:
      - mcp-net

  pg-mcp-server:
    build: .
    image: pg-mcp-server:latest
    # Fixed hostname: it is written into the SAN of the self-signed cert, which is
    # persisted in mcp-certs — a random container ID would change on every re-create.
    hostname: ${MCP_HOSTNAME:-pg-mcp-server}
    ports:
      - "${MCP_PORT:-3000}:3000"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      TRANSPORT: http
      PORT: 3000

      # ── TLS (HTTPS) ───────────────────────────────────────────────────────
      # false → plain HTTP (default)
      # true  → HTTPS (requires a cert volume mounted at /certs)
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE:  /certs/tls.key
      # TLS_CA_FILE: /certs/client-ca.crt
      # TLS_SAN: "${TLS_SAN:-}"

      # ── Server identity ───────────────────────────────────────────────────
      # Name shown in MCP clients and the Admin UI (default: pg-mcp-server)
      MCP_SERVER_NAME: "${MCP_SERVER_NAME:-pg-mcp-server}"

      # ── Logging ───────────────────────────────────────────────────────────
      # debug | info | warn | error — SQL text only logged at debug
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Admin UI branding (logo + colors), files from the /branding mount below
      ADMIN_THEME_CSS: "${ADMIN_THEME_CSS:-}"
      ADMIN_LOGO: "${ADMIN_LOGO:-}"

      # ── Authentication ────────────────────────────────────────────────────
      # Bearer token for /mcp and /admin/tokens (empty = auth disabled)
      # Generate with: openssl rand -hex 32
      AUTH_TOKEN: "${AUTH_TOKEN:-}"

      # ── OAuth 2.0 / OIDC (Entra ID, …) — see docs/oauth.md; empty OAUTH_ISSUER = off ──
      OAUTH_ISSUER: "${OAUTH_ISSUER:-}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-}"
      OAUTH_AUDIENCE: "${OAUTH_AUDIENCE:-}"
      OAUTH_PUBLIC_URL: "${OAUTH_PUBLIC_URL:-}"
      OAUTH_GROUPS_CLAIM: "${OAUTH_GROUPS_CLAIM:-}"
      OAUTH_ALLOWED_GROUPS: "${OAUTH_ALLOWED_GROUPS:-}"
      OAUTH_ALLOWED_USERS: "${OAUTH_ALLOWED_USERS:-}"
      OAUTH_ADMIN_GROUPS: "${OAUTH_ADMIN_GROUPS:-}"
      OAUTH_ADMIN_USERS: "${OAUTH_ADMIN_USERS:-}"
      OAUTH_ASSIGNMENTS: "${OAUTH_ASSIGNMENTS:-}"

      # ── Token store ───────────────────────────────────────────────────────
      TOKENS_FILE: /data/tokens.json

      # ── PostgreSQL (default / admin connection) ───────────────────────────
      PG_HOST: "${PG_HOST:-postgres-test}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DATABASE: "${PG_DATABASE:-testdb}"
      PG_USER: "${PG_USER:-postgres}"
      PG_PASSWORD: "${PG_PASSWORD:-postgres}"
      # PG_SSL: false | true | verify
      PG_SSL: "${PG_SSL:-false}"
      # X-Pg-* headers of AUTH_TOKEN clients: none | credentials | full
      PG_CLIENT_CONNECTION: "${PG_CLIENT_CONNECTION:-none}"
      PG_SSL_CA_FILE: "${PGSSLROOTCERT:-/certs/pg-ca.crt}"

    volumes:
      - mcp-data:/data               # persist token store (tokens.json)
      - mcp-certs:/certs             # persist TLS certs (self-signed cert is generated here on first start)
      # admin UI theme.css / logo (ADMIN_THEME_CSS, ADMIN_LOGO)
      - ${BRANDING_DIR:-./examples/admin-theme}:/branding:ro
      # - ./certs:/certs             # alternative: bind-mount your own certs instead of mcp-certs

    networks:
      - mcp-net

    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge

volumes:
  mcp-data:
  mcp-certs:
