version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      production:
        patterns: ["@modelcontextprotocol/*", "express", "zod"]
      toolchain:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*", "eslint", "@eslint/*", "tsx"]
      dev:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # Node major stays in sync with node-version in ci.yml/release.yml; bump all of them by hand
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
