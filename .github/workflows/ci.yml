name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: npx vitest run --coverage

  integration:
    name: Integration (PostgreSQL + OIDC providers)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL, the OIDC mock provider and Keycloak
        run: docker compose --profile oidc --profile keycloak up -d --wait postgres-test oidc-test keycloak

      - name: Integration tests (mock provider)
        run: npx vitest run tests/oidc.integration.test.js tests/postgres.integration.test.js tests/skills.integration.test.js
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5433
          OIDC_TEST_ISSUER: http://localhost:8080/default

      - name: OIDC integration tests against Keycloak (real login form) and admincli.sh against a real server
        run: npx vitest run tests/oidc.integration.test.js tests/admincli.integration.test.js
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5433
          OIDC_TEST_ISSUER: http://localhost:8081/realms/pg-mcp

      - name: Container logs
        if: failure()
        run: docker compose --profile oidc --profile keycloak logs --tail 100 postgres-test oidc-test keycloak

      - name: Stop containers
        if: always()
        run: docker compose --profile oidc --profile keycloak down -v
