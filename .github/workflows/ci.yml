name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: npx vitest run --coverage

  integration:
    name: Integration (PostgreSQL + OIDC providers)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL, the OIDC mock provider and Keycloak
        run: docker compose --profile oidc --profile keycloak up -d --wait postgres-test oidc-test keycloak

      - name: Integration tests (mock provider)
        run: npx vitest run tests/oidc.integration.test.js tests/postgres.integration.test.js tests/skills.integration.test.js
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5433
          OIDC_TEST_ISSUER: http://localhost:8080/default

      - name: OIDC integration tests against Keycloak (real login form) and admincli.sh against a real server
        run: npx vitest run tests/oidc.integration.test.js tests/admincli.integration.test.js
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5433
          OIDC_TEST_ISSUER: http://localhost:8081/realms/pg-mcp

      - name: Container logs
        if: failure()
        run: docker compose --profile oidc --profile keycloak logs --tail 100 postgres-test oidc-test keycloak

      - name: Stop containers
        if: always()
        run: docker compose --profile oidc --profile keycloak down -v

  image-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pg-mcp-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on fixable HIGH/CRITICAL vulnerabilities, secrets and Dockerfile misconfigurations
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pg-mcp-server:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
